# Plain-HTTP server: only used for the ACME (Let's Encrypt) challenge and to
# redirect everything else to HTTPS. Run `certbot --nginx` after first deploy
# to auto-provision certs and it will rewrite this file's cert paths for you.
server {
    listen 80;
    server_name aswinimakeover.example.com;  # TODO: replace with your domain / server IP

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name aswinimakeover.example.com;  # TODO: replace with your domain / server IP

    # TODO: point these at the cert/key produced by certbot (or your CA of choice)
    ssl_certificate     /etc/letsencrypt/live/aswinimakeover.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aswinimakeover.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Allows: Razorpay checkout (script + iframe), Google Fonts, and Supabase
    # (API calls + storage-hosted portfolio images). Update the Supabase host
    # below if this ever points at a different Supabase project.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://dpgfozdjvcwntttbsirc.supabase.co https://*.razorpay.com; connect-src 'self' https://dpgfozdjvcwntttbsirc.supabase.co https://api.razorpay.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests;" always;

    client_max_body_size 20M;

    # Proxy all /api requests to FastAPI backend
    location /api {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }

    # Serve React frontend (SPA), cached aggressively; index.html itself is
    # never cached so deploys are picked up immediately.
    location / {
        root /var/www/aswini-makeover/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2?)$ {
        root /var/www/aswini-makeover/frontend/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
